# Keep Android builds within constrained development environments (for example,
# WSL with limited RAM). These settings intentionally favor lower peak memory
# over build throughput.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
org.gradle.parallel=false
# Avoid retaining one memory-heavy daemon per Gradle version when switching
# branches in constrained WSL environments.
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# Flutter 3.47 supports AGP's built-in Kotlin integration.
android.builtInKotlin=true
# Flutter's Gradle plugin still casts to the legacy AGP application extension.
# Remove this opt-out once Flutter supports the new AGP DSL.
android.newDsl=false
